<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse-ring{0%{transform:scale(.95);opacity:.8}50%{transform:scale(1.05);opacity:.4}}.badge-text,.node-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:400;font-size:20px;fill:#cbd5e1}.badge-text,.node-text{font-weight:600;font-size:13px;fill:#e2e8f0}.node-text{font-size:12px;fill:#a7f3d0}.floating-node-1{animation:float 6s ease-in-out infinite}.pulse-circle{animation:pulse-ring 4s ease-in-out infinite;transform-origin:center}.animated-flow{stroke-dasharray:8,8;animation:dash 2s linear infinite}</style></defs><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g opacity=".1"><path stroke="#fff" stroke-width="1" d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200"/><path stroke="#fff" stroke-width="1" d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300"/></g><circle cx="150" cy="80" r="120" fill="#818cf8" clas