<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #a7f3d0; }
      
      /* Subtle background pulse animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 0.4; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }

      .floating-node-1 { animation: float 6s ease-in-out infinite; }
      .floating-node-2 { animation: float 8s ease-in-out infinite 1s; }
      .pulse-circle { animation: pulse-ring 4s ease-in-out infinite; transform-origin: center; }
      .animated-flow { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Glowing Orbs (Dynamic Background Aspects) -->
  <circle cx="150" cy="80" r="120" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="1050" cy="220" r="140" fill="#c084fc" opacity="0.15" filter="url(#glow)" class="pulse-circle"/>

  <!-- Dynamic Bot Flow Graphic Elements (Background Right Side) -->
  <g opacity="0.45" class="floating-node-1">
    <!-- Connecting Flow Lines -->
    <path d="M 820 100 Q 900 70 980 110 T 1080 180" fill="none" stroke="#818cf8" stroke-width="2" class="animated-flow"/>
    <path d="M 850 200 Q 940 230 1020 180" fill="none" stroke="#c084fc" stroke-width="2" class="animated-flow"/>

    <!-- Dynamic Flow Nodes -->
    <rect x="760" y="80" width="120" height="40" rx="8" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="820" y="105" text-anchor="middle" class="node-text">⚡ Intent Parser</text>

    <rect x="940" y="90" width="110" height="40" rx="8" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="995" y="115" text-anchor="middle" class="node-text">🧠 NLU Engine</text>

    <rect x="830" y="180" width="130" height="40" rx="8" fill="url(#card-grad)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="895" y="205" text-anchor="middle" class="node-text">🔀 Flow Builder</text>

    <rect x="1010" y="160" width="120" height="40" rx="8" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1070" y="185" text-anchor="middle" class="node-text">💬 Multi-Channel</text>
  </g>

  <!-- Foreground Main Title & Subtitle Section -->
  <g transform="translate(60, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#accent-grad)" opacity="0.2"/>
      <rect x="0" y="0" width="280" height="32" rx="16" fill="none" stroke="url(#accent-grad)" stroke-width="1.5"/>
      <text x="140" y="21" text-anchor="middle" class="badge-text">🚀 AWESOME CONVERSATIONAL BOT BUILDER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Conversational Bot Builder</text>
    
    <!-- Accent Line -->
    <rect x="0" y="152" width="480" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Curated directory of SaaS platforms, Open-Source bot engines,</text>
    <text x="0" y="218" class="subtitle">visual flow builders &amp; NLU frameworks for AI developers.</text>

    <!-- Tech Stack Feature Pills -->
    <g transform="translate(0, 242)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="55" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">🤖 SaaS &amp; OS</text>

      <rect x="120" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="180" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">📊 Market Data</text>

      <rect x="250" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="305" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">⭐ Star Ranked</text>
    </g>
  </g>
</svg>
